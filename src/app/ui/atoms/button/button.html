<button
  [class]="buttonClass()"
  [type]="type()"
  [disabled]="disabled() || loading()"
  [attr.aria-busy]="loading() ? 'true' : null"
  [attr.aria-label]="ariaLabel() || label() || null"
  (click)="clicked.emit()"
>
  @if (loading()) {
    <span class="loading loading-spinner loading-xs sm:loading-sm" aria-hidden="true"></span>
  }
  @if (label()) {
    <span>{{ label() }}</span>
  } @else {
    <ng-content />
  }
</button>
