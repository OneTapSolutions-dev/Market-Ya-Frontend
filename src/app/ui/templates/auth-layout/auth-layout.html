<div class="min-h-screen bg-slate-100 text-slate-900 flex items-center justify-center p-4 relative overflow-hidden select-none">
  <!-- Fondo decorativo superior con degradado naranja corporativo -->
  <div class="absolute top-0 left-0 right-0 h-80 bg-gradient-to-br from-orange-500 via-orange-600 to-amber-500 shadow-xl pointer-events-none">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(255,255,255,0.2),transparent_50%)]"></div>
  </div>

  <div class="max-w-md w-full bg-white border border-slate-200/80 rounded-3xl p-8 shadow-2xl shadow-orange-900/10 relative z-10">
    <!-- Logotipo y Nombre Comercial -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center p-2 bg-gradient-to-tr from-orange-500 to-amber-500 rounded-2xl shadow-lg shadow-orange-500/30 mb-4 overflow-hidden">
        <img
          src="/logo.jpg"
          alt="MarketYa"
          class="w-20 h-16 object-contain rounded-xl bg-white p-1 max-w-[90px] max-h-[70px]"
          (error)="onLogoError($event)"
        />
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">
        MarketYa!
      </h1>
      <p class="text-xs text-primary mt-1 uppercase font-bold tracking-wider">
        Sistema Comercial & Facturación SUNAT
      </p>
    </div>

    <!-- Contenido Proyectado (Formulario / Selector de Perfil) -->
    <ng-content />
  </div>

  <ui-toast-container />
</div>
