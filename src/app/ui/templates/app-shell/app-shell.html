<div class="app-shell min-h-screen text-slate-900 flex flex-col font-sans antialiased selection:bg-primary selection:text-white">
  <!-- Enlace accesible de salto al contenido -->
  <a
    href="#main-content"
    class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2.5 focus:bg-primary focus:text-white focus:rounded-xl focus:shadow-2xl focus:font-extrabold focus:outline-none focus:ring-4 focus:ring-orange-500/40 text-xs"
  >
    Saltar al contenido principal
  </a>

  <!-- Cabecera Superior -->
  <ui-header [(isMobileMenuOpen)]="isMobileMenuOpen" />

  <!-- Menú Móvil Desplegable -->
  <ui-mobile-nav [(open)]="isMobileMenuOpen" />

  <!-- Contenedor Principal con Router Outlet -->
  <main id="main-content" class="app-main flex-1 w-full mx-auto p-4 sm:p-6 lg:p-8">
    <router-outlet />
    <ng-content />
  </main>

  <!-- Pila de Toasts Flotantes -->
  <ui-toast-container />
</div>
