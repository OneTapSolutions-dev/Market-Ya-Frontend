@if (open()) {
  <div
    class="modal modal-open z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title() || 'Ventana emergente'"
    (keydown.escape)="close()"
  >
    <div [class]="boxClass()">
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
        @if (title()) {
          <h3 class="text-base sm:text-lg font-extrabold text-slate-900 leading-tight">
            {{ title() }}
          </h3>
        }
        <button
          type="button"
          class="btn btn-ghost btn-sm btn-circle text-slate-400 hover:text-slate-700 ml-auto"
          aria-label="Cerrar ventana"
          (click)="close()"
        >
          <ui-icon name="close" size="1.25rem" />
        </button>
      </div>

      <div class="max-h-[calc(85vh-10rem)] overflow-y-auto pr-1">
        <ng-content />
      </div>

      <div class="modal-action mt-6 pt-3 border-t border-slate-100 flex items-center justify-end gap-2 empty:hidden">
        <ng-content select="[modal-actions], [slot=footer]" />
      </div>
    </div>

    <!-- Backdrop click overlay -->
    <div
      class="fixed inset-0 -z-10"
      aria-hidden="true"
      (click)="onBackdropClick()"
    ></div>
  </div>
}
