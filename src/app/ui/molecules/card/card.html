<div
  class="card bg-base-100 shadow-sm rounded-2xl sm:rounded-3xl"
  [class.border]="bordered()"
  [class.border-slate-200]="bordered()"
  [class]="customClass()"
>
  <div class="card-body p-4 sm:p-6">
    @if (title()) {
      <div class="mb-2">
        <h3 class="card-title text-base sm:text-lg font-extrabold text-slate-900">{{ title() }}</h3>
        @if (subtitle()) {
          <p class="text-xs text-slate-500 font-medium mt-0.5">{{ subtitle() }}</p>
        }
      </div>
    }

    <ng-content />

    <div class="card-actions justify-end empty:hidden">
      <ng-content select="[card-actions]" />
    </div>
  </div>
</div>
