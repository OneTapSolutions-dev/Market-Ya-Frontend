<div
  aria-live="polite"
  aria-relevant="additions"
  class="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none"
>
  @for (toast of toasts(); track toast.id) {
    <div
      class="toast-in pointer-events-auto p-4 rounded-2xl shadow-xl border flex items-start gap-3 transition-all duration-300"
      [attr.role]="toast.type === 'error' ? 'alert' : 'status'"
      [class.bg-emerald-600]="toast.type === 'success'"
      [class.border-emerald-500]="toast.type === 'success'"
      [class.text-white]="toast.type === 'success'"
      [class.bg-amber-500]="toast.type === 'warning'"
      [class.border-amber-400]="toast.type === 'warning'"
      [class.text-slate-950]="toast.type === 'warning'"
      [class.bg-rose-600]="toast.type === 'error'"
      [class.border-rose-500]="toast.type === 'error'"
      [class.text-white]="toast.type === 'error'"
      [class.bg-sky-600]="toast.type === 'info'"
      [class.border-sky-500]="toast.type === 'info'"
      [class.text-white]="toast.type === 'info'"
    >
      @if (toast.type === 'success') {
        <ui-icon name="checkCircle" size="1.25rem" class="text-white shrink-0 mt-0.5" />
      } @else if (toast.type === 'warning') {
        <ui-icon name="exclamationTriangle" size="1.25rem" class="text-slate-950 shrink-0 mt-0.5" />
      } @else if (toast.type === 'error') {
        <ui-icon name="xCircle" size="1.25rem" class="text-white shrink-0 mt-0.5" />
      } @else {
        <ui-icon name="informationCircle" size="1.25rem" class="text-white shrink-0 mt-0.5" />
      }

      <div class="flex-1 min-w-0">
        <h4
          class="font-extrabold text-xs tracking-wide"
          [class.text-white]="toast.type !== 'warning'"
          [class.text-slate-950]="toast.type === 'warning'"
        >
          {{ toast.title }}
        </h4>
        <p
          class="text-xs mt-0.5 leading-snug font-medium"
          [class.text-emerald-50]="toast.type === 'success'"
          [class.text-slate-900]="toast.type === 'warning'"
          [class.text-rose-50]="toast.type === 'error'"
          [class.text-sky-50]="toast.type === 'info'"
        >
          {{ toast.message }}
        </p>
      </div>

      <button
        type="button"
        class="min-h-9 min-w-9 p-1.5 cursor-pointer opacity-80 hover:opacity-100 transition-opacity focus:outline-none focus-visible:ring-2 focus-visible:ring-white rounded-lg flex items-center justify-center"
        [class.text-white]="toast.type !== 'warning'"
        [class.text-slate-950]="toast.type === 'warning'"
        [attr.aria-label]="'Cerrar notificación: ' + toast.title"
        (click)="remove(toast.id)"
      >
        <ui-icon name="close" size="1rem" />
      </button>
    </div>
  }
</div>
