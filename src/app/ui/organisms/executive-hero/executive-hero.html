<div class="bg-gradient-to-r from-orange-500 via-amber-500 to-orange-600 rounded-3xl p-5 sm:p-8 text-white shadow-xl relative overflow-hidden select-none">
  <div
    aria-hidden="true"
    class="absolute inset-0 opacity-[0.12] mix-blend-soft-light pointer-events-none"
    style="background-image: url('/logo.jpg'); background-size: 240px 135px;"
  ></div>
  <div
    aria-hidden="true"
    class="absolute inset-0 bg-gradient-to-r from-orange-700/25 via-transparent to-amber-700/25 pointer-events-none"
  ></div>
  <div
    class="absolute right-0 top-0 bottom-0 w-1/3 bg-[radial-gradient(circle_at_top_right,rgba(255,255,255,0.25),transparent)] pointer-events-none"
  ></div>

  <div class="flex flex-col items-start justify-between gap-4 relative z-10 sm:flex-row sm:items-center">
    <div class="flex flex-col items-start gap-2">
      <h1 class="max-w-full break-words text-3xl leading-tight font-extrabold text-white sm:text-5xl lg:text-6xl">
        ¡Bienvenido {{ userName() }}!
      </h1>
      <span class="text-xs leading-relaxed text-orange-50 font-semibold font-mono sm:text-sm capitalize">
        {{ todayDate }}
      </span>
    </div>

    <div class="card self-center bg-white text-slate-900 shadow-xl sm:self-auto rounded-2xl">
      <div class="card-body items-center p-2 sm:p-3">
        <img
          src="/logo.jpg"
          alt="Logo de MarketYa"
          class="w-32 h-auto rounded-xl object-contain sm:w-40 lg:w-52"
          (error)="onLogoError($event)"
        />
      </div>
    </div>
  </div>
</div>
