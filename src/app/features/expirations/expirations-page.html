<div class="space-y-6">
  <!-- Políticas de Proveedores (Organismo) -->
  <ui-supplier-policies-list
    [policies]="store.supplierPolicies()"
    (policyAdded)="onPolicyAdded($event)"
    (exportCanjesRequested)="onExportCanjes()"
  />

  <!-- Tabla de Vencimientos y Asignación de Oferta (Organismo) -->
  <ui-expirations-table
    [products]="store.products()"
    (discountAssigned)="onDiscountAssigned($event)"
  />
</div>
