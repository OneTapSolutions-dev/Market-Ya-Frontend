<ui-auth-layout>
  <div class="max-w-md w-full bg-white border border-slate-200/80 rounded-3xl p-8 shadow-2xl shadow-orange-900/10">
    <!-- Logo & Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center p-2 bg-gradient-to-tr from-orange-500 to-amber-500 rounded-2xl shadow-lg shadow-orange-500/30 mb-4 overflow-hidden">
        <img
          src="/logo.jpg"
          alt="MarketYa Logo"
          class="w-20 h-16 object-contain rounded-xl bg-white p-1"
          style="max-width: 90px; max-height: 70px;"
        />
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">
        MarketYa!
      </h1>
      <p class="text-xs text-orange-600 mt-1 uppercase font-bold tracking-wider">
        Sistema Comercial & Facturación SUNAT
      </p>
    </div>

    <!-- Role Quick Selectors -->
    <div class="mb-6">
      <label class="block text-xs font-bold text-slate-600 mb-2">Seleccione Perfil para la Demostración:</label>
      <div class="grid grid-cols-2 gap-3">
        <button
          type="button"
          (click)="selectRole('admin')"
          [class]="selectedRole() === 'admin'
            ? 'p-3 rounded-2xl border-2 border-orange-500 bg-orange-50 text-orange-600 font-bold flex items-center justify-center gap-2 text-sm transition-all shadow-sm cursor-pointer'
            : 'p-3 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 flex items-center justify-center gap-2 text-sm transition-all cursor-pointer'"
        >
          <ui-icon name="shieldCheck" size="1.1rem" class="text-orange-500" />
          <span>Administrador</span>
        </button>

        <button
          type="button"
          (click)="selectRole('cajero')"
          [class]="selectedRole() === 'cajero'
            ? 'p-3 rounded-2xl border-2 border-orange-500 bg-orange-50 text-orange-600 font-bold flex items-center justify-center gap-2 text-sm transition-all shadow-sm cursor-pointer'
            : 'p-3 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 flex items-center justify-center gap-2 text-sm transition-all cursor-pointer'"
        >
          <ui-icon name="shoppingCart" size="1.1rem" class="text-orange-500" />
          <span>Cajero / POS</span>
        </button>
      </div>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onLogin()" class="space-y-4 text-xs">
      <div>
        <label class="block font-bold text-slate-700 mb-1.5" for="loginUsername">Usuario de Acceso</label>
        <div class="flex items-center gap-2 px-3.5 py-3 bg-slate-50 border border-slate-300 rounded-xl focus-within:bg-white focus-within:border-orange-500 focus-within:ring-2 focus-within:ring-orange-500/20 transition-all">
          <input
            id="loginUsername"
            name="username"
            type="text"
            [value]="username()"
            (input)="username.set($any($event.target).value)"
            required
            class="w-full bg-transparent border-0 p-0 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-0 font-medium"
            placeholder="Ej. admin1"
          />
        </div>
      </div>

      <div>
        <label class="block font-bold text-slate-700 mb-1.5" for="loginPassword">Contraseña</label>
        <div class="flex items-center gap-2 px-3.5 py-3 bg-slate-50 border border-slate-300 rounded-xl focus-within:bg-white focus-within:border-orange-500 focus-within:ring-2 focus-within:ring-orange-500/20 transition-all">
          <input
            id="loginPassword"
            name="password"
            type="password"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            required
            class="w-full bg-transparent border-0 p-0 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-0 font-medium"
            placeholder="••••••••••••"
          />
        </div>
      </div>

      <div class="pt-2">
        <button
          type="submit"
          class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-extrabold py-3.5 px-6 rounded-2xl shadow-lg shadow-orange-500/30 transition-all flex items-center justify-center gap-2 cursor-pointer active:scale-98"
        >
          <span>Ingresar al Sistema MarketYa</span>
          <ui-icon name="sparkles" size="1.1rem" class="text-white" />
        </button>
      </div>
    </form>

    <!-- Credentials Helper Footer -->
    <div class="mt-6 pt-5 border-t border-slate-200 text-center">
      <p class="text-xs text-slate-500 font-medium mb-2">Credenciales rápidas para demostración:</p>
      <div class="flex items-center justify-center gap-2 text-xs font-mono text-orange-700 flex-wrap">
        <span class="px-2.5 py-1 bg-orange-50 rounded-lg border border-orange-200 font-semibold">Admin: admin1 / demo123</span>
        <span class="px-2.5 py-1 bg-orange-50 rounded-lg border border-orange-200 font-semibold">Caja: cajero1 / demo123</span>
      </div>
    </div>
  </div>
</ui-auth-layout>
